[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.1.0"
description = "Testing intelligence platform for CI failure analysis"
authors = [{ name = "Daniel Beard" }]
requires-python = ">=3.10"
dependencies = [
    "typer", "tomli-w", "rich", "scapy", "pefile", "protobuf",
    "py7zr", "pyarrow", "pyelftools", "pyyaml", 
    "avro"
]

[project.scripts]
aegis = "aegis_prime.cli:app"
aql-test = "aegis_prime.aql_compliance.runner:main"