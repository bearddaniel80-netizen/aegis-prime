[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "1.2.0"
description = "Testing intelligence platform for CI failure analysis"
authors = [{ name = "Daniel Beard" }]
requires-python = ">=3.10"
dependencies = [
    "typer", "tomli-w", "rich", "scapy", "pefile", "protobuf",
    "py7zr", "pyarrow", "pyelftools", "pyyaml", "avro", "fastavro",
    "jinja2", "reportlab", "pandas"
]

[project.scripts]
aegis = "aegis_prime.cli:app"