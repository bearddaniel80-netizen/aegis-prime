[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.1.0"
description = "Testing intelligence platform for CI failure analysis"
authors = [{ name = "Daniel Beard" }]
requires-python = ">=3.10"
dependencies = [
    "typer",
]

[project.scripts]
aegis = "aegis_prime.cli:app"